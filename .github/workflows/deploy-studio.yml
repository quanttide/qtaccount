# 部署账号中心 studio：推送 studio/* tag（如 studio/v0.1.0，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Web 产物上传到 OSS 静态网站桶，并刷新 CDN 缓存。
#
# 架构（对齐 qtcloud-delib 部署模式）：
#   studio/* tag → Actions（flutter build web + ossutil cp）→ OSS 桶（静态网站模式）
#   → 阿里云 CDN（account.quanttide.com，泛域名证书 *.quanttide.com）→ 用户浏览器
#
# 所需 GitHub secrets（repo 级——org secrets 免费版对私有仓库不可见）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）
# 所需 vars（repo 级）：
#   - QTCLOUD_AUTH_BASE_URL：https://api.quanttide.com/qtcloud-auth
#   - QTCLOUD_PAY_BASE_URL：https://api.quanttide.com/qtcloud-pay
#
# 前置条件（首次需人工在阿里云控制台完成，见执行大纲 P4）：
#   - OSS 桶 qtaccount-studio：静态网站托管模式 + 公共读（SupportSubDir=true）
#   - CDN 域名 account.quanttide.com：CNAME 指向 CDN 加速域名，绑定泛域名证书
#   - DNS：account.quanttide.com CNAME → CDN

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'

concurrency:
  group: deploy-studio
  cancel-in-progress: false

env:
  OSS_BUCKET: qtaccount-studio
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: account.quanttide.com

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁版本 3.44.8（与 qtdata/qtcloud-delib 部署模板一致）：
      # 项目要求 SDK 3.12.2+，旧版 Flutter 构建会失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Build Web
        working-directory: src/studio
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=QTCLOUD_AUTH_BASE_URL=${{ vars.QTCLOUD_AUTH_BASE_URL }} \
            --dart-define=QTCLOUD_PAY_BASE_URL=${{ vars.QTCLOUD_PAY_BASE_URL }}

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 缓存策略分离（Flutter Web 部署要点，delib 发版旧缓存事故教训）：
      # 哈希产物（assets/ canvaskit/）长缓存；固定名入口文件必须 no-cache，
      # 否则发版后浏览器拿旧 JS（main.dart.js 文件名不随内容变化）
      - name: Upload to OSS（产物长缓存）
        run: ossutil cp src/studio/build/web/ oss://${{ env.OSS_BUCKET }}/ -r -f --exclude "index.html" --exclude "main.dart.js" --exclude "flutter_bootstrap.js" --exclude "flutter.js" --exclude "manifest.json" --exclude "version.json" --meta=Cache-Control:public,max-age=31536000

      - name: Upload to OSS（入口文件 no-cache）
        run: |
          for f in index.html main.dart.js flutter_bootstrap.js flutter.js manifest.json version.json flutter_service_worker.js favicon.png; do
            ossutil cp "src/studio/build/web/$f" "oss://${{ env.OSS_BUCKET }}/$f" -f --meta=Cache-Control:no-cache
          done

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
